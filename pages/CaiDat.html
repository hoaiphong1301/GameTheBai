<div class="page settings-page" data-page="settings">
    <h2>Cài Đặt</h2>
    
    <div class="setting-item">
        <div class="setting-label">
            <span>🔊 Âm Thanh Nền</span>
            <div class="toggle-switch active" id="bgmToggle">
                <div class="toggle-slider"></div>
            </div>
        </div>
        <div class="setting-desc">Bật/Tắt nhạc nền của trò chơi</div>
    </div>

    <div class="setting-item">
        <div class="setting-label">
            <span>🔉 Hiệu Ứng Âm Thanh</span>
            <div class="toggle-switch active" id="sfxToggle">
                <div class="toggle-slider"></div>
            </div>
        </div>
        <div class="setting-desc">Bật/Tắt âm thanh hiệu ứng</div>
    </div>

    <div class="setting-item">
        <div class="setting-label">
            <span>🎮 Độ Khó</span>
        </div>
        <select>
            <option>Dễ</option>
            <option selected>Bình thường</option>
            <option>Khó</option>
        </select>
        <div class="setting-desc">Chọn độ khó chơi game</div>
    </div>

    <div class="setting-item">
        <div class="setting-label">
            <span>👤 Ngôn Ngữ</span>
        </div>
        <select>
            <option selected>Tiếng Việt</option>
            <option>English</option>
            <option>中文</option>
        </select>
        <div class="setting-desc">Chọn ngôn ngữ giao diện</div>
    </div>

    <button class="setting-button" onclick="resetProgress()">🔄 Reset Tiến Trình</button>
    <button class="setting-button" style="background: linear-gradient(90deg, #764ba2 0%, #667eea 100%);">📱 Liên Hệ Hỗ Trợ</button>
</div>
