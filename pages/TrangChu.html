<div class="page active main-page" data-page="main">
    <h2>🎮 Màn Chơi</h2>
    <div class="levels-container">
        <div class="levels-grid" id="levelsGrid"></div>
    </div>
</div>

<style>
    .levels-container {
        width: 100%;
        height: 100%;
        padding: 20px;
    }

    .main-page h2 {
        color: #fff;
        margin-bottom: 30px;
        font-size: 28px;
        text-align: center;
    }

    .levels-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 15px;
        width: 100%;
        justify-items: center;
        animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .level-bubble {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        border: 3px solid transparent;
        position: relative;
        font-weight: bold;
    }

    .level-bubble .level-num {
        font-size: 24px;
        color: #fff;
        font-weight: bold;
        z-index: 2;
    }

    .level-bubble .level-star {
        font-size: 12px;
        color: #ffd700;
        position: absolute;
        top: 5px;
        right: 5px;
        background: rgba(0, 0, 0, 0.5);
        padding: 2px 5px;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Màu sắc cho các nhóm màn */
    .level-bubble.tier-1 {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .level-bubble.tier-2 {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .level-bubble.tier-3 {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    .level-bubble.tier-4 {
        background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }

    .level-bubble:hover:not(.locked) {
        transform: scale(1.15);
        box-shadow: 0 8px 25px rgba(233, 69, 96, 0.6);
        border-color: #e94560;
    }

    .level-bubble.locked {
        background: linear-gradient(135deg, #333 0%, #555 100%);
        opacity: 0.5;
        cursor: not-allowed;
    }

    .level-bubble.locked:hover {
        transform: none;
        border-color: transparent;
    }

    .level-bubble.locked .level-num {
        font-size: 20px;
    }

    .level-bubble.completed {
        border: 3px solid #ffd700;
    }

    .level-bubble.completed::after {
        content: '✓';
        position: absolute;
        font-size: 20px;
        color: #ffd700;
        right: -5px;
        top: -5px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 50%;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
    }

    .level-bubble:active:not(.locked) {
        transform: scale(0.95);
    }

    /* Responsive */
    @media (max-width: 1200px) {
        .levels-grid {
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
        }

        .level-bubble {
            width: 70px;
            height: 70px;
        }

        .level-bubble .level-num {
            font-size: 18px;
        }
    }

    @media (max-width: 768px) {
        .levels-grid {
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
        }

        .level-bubble {
            width: 60px;
            height: 60px;
        }

        .level-bubble .level-num {
            font-size: 14px;
        }
    }
</style>

<script>
    // Tạo 100 màn chơi
    window.generateLevels = function() {
        const container = document.getElementById('levelsGrid');
        if (!container) return;
        
        container.innerHTML = '';

        for (let i = 1; i <= 100; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'level-bubble';
            
            // Phân loại màu theo nhóm (mỗi nhóm 25 màn)
            if (i <= 25) {
                bubble.classList.add('tier-1');
            } else if (i <= 50) {
                bubble.classList.add('tier-2');
            } else if (i <= 75) {
                bubble.classList.add('tier-3');
            } else {
                bubble.classList.add('tier-4');
            }

            // Xác định màn bị khoá (chỉ mở đến màn 35)
            if (i > 35) {
                bubble.classList.add('locked');
            } else {
                // Ngẫu nhiên đánh dấu một số màn đã hoàn thành
                if (Math.random() < 0.3) {
                    bubble.classList.add('completed');
                }
            }

            const levelNum = document.createElement('div');
            levelNum.className = 'level-num';
            levelNum.textContent = i;

            const starContainer = document.createElement('div');
            starContainer.className = 'level-star';
            const stars = Math.floor(Math.random() * 3) + 1; // 1-3 sao
            starContainer.textContent = '⭐'.repeat(stars);

            bubble.appendChild(levelNum);
            bubble.appendChild(starContainer);

            // Thêm sự kiện click
            if (!bubble.classList.contains('locked')) {
                bubble.addEventListener('click', function() {
                    alert(`⚔️ Bắt đầu màn chơi ${i}! \n(Chức năng này sẽ được phát triển)`);
                });
            } else {
                bubble.addEventListener('click', function() {
                    alert(`🔒 Màn ${i} chưa mở khóa!\nHoàn thành các màn trước để mở khóa.`);
                });
            }

            container.appendChild(bubble);
        }
    };

    // Gọi hàm ngay lập tức
    generateLevels();
</script>
